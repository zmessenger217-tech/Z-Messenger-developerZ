    <script>
      // Cleanly intercept and mute benign Vite HMR websocket connection errors
      (function() {
        const isWsError = function(msg) {
          const str = String(msg || '');
          return str.includes('WebSocket') || str.includes('websocket') || str.includes('closed without opened');
        };

        window.addEventListener('error', function(e) {
          if (e && (isWsError(e.message) || isWsError(e.error?.message))) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          if (e && (isWsError(e.reason) || isWsError(e.reason?.message))) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        });

        // Patch WebSocket error event dispatcher to mute connection warnings
        if (typeof window.WebSocket !== 'undefined') {
          const OrigWebSocket = window.WebSocket;
          window.WebSocket = function(url, protocols) {
            const ws = protocols !== undefined ? new OrigWebSocket(url, protocols) : new OrigWebSocket(url);
            ws.addEventListener('error', function(errEvent) {
              if (errEvent && errEvent.stopImmediatePropagation) {
                errEvent.stopImmediatePropagation();
              }
            });
            return ws;
          };
          window.WebSocket.prototype = OrigWebSocket.prototype;
          window.WebSocket.CONNECTING = OrigWebSocket.CONNECTING;
          window.WebSocket.OPEN = OrigWebSocket.OPEN;
          window.WebSocket.CLOSING = OrigWebSocket.CLOSING;
          window.WebSocket.CLOSED = OrigWebSocket.CLOSED;
        }
      })();
    </script>

    <script>
      // Register PWA service worker for Chrome installability and offline support
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(function(reg) {
              console.log('[PWA] Service Worker registered successfully with scope:', reg.scope);
            })
            .catch(function(err) {
              console.warn('[PWA] Service Worker registration failed:', err);
            });
        });
      }
    </script>
