<!doctype html>
<html lang="en">
  <head>
    <script>
      // Immediately intercept console methods to suppress benign Vite HMR & WebSocket noise
      (function() {
        const isBenignNoise = function(msg) {
          const str = String(msg || '');
          return str.includes('[vite]') || str.includes('WebSocket') || str.includes('websocket') || str.includes('closed without opened') || str.includes('vite-hmr');
        };

        const checkArgs = function(args) {
          for (let i = 0; i < args.length; i++) {
            const a = args[i];
            const str = String(a && (a.message || a.stack || a) || '');
            if (isBenignNoise(str)) return true;
          }
          return false;
        };

        const origError = console.error;
        console.error = function(...args) {
          if (checkArgs(args)) return;
          return origError.apply(console, args);
        };

        const origWarn = console.warn;
        console.warn = function(...args) {
          if (checkArgs(args)) return;
          return origWarn.apply(console, args);
        };

        const origInfo = console.info;
        console.info = function(...args) {
          if (checkArgs(args)) return;
          return origInfo.apply(console, args);
        };

        const origDebug = console.debug;
        console.debug = function(...args) {
          if (checkArgs(args)) return;
          return origDebug.apply(console, args);
        };

        const origLog = console.log;
        console.log = function(...args) {
          if (checkArgs(args)) return;
          return origLog.apply(console, args);
        };

        window.addEventListener('error', function(e) {
          if (e && (isBenignNoise(e.message) || isBenignNoise(e.error && (e.error.message || e.error.stack)))) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          if (e && (isBenignNoise(e.reason) || isBenignNoise(e.reason && (e.reason.message || e.reason.stack)))) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        });
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Z-Messenger</title>
    <meta name="description" content="Real-time communication app featuring direct messaging, multi-person group chats, group DP management, stories, voice and video calls, and built-in Gemini AI conversational assistant." />

    <meta name="apple-mobile-web-app-capable" content="yes" />

  </head>
  <body class="bg-amber-500/5 text-neutral-900 antialiased font-['Plus_Jakarta_Sans',sans-serif] selection:bg-orange-500 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register PWA service worker for Chrome installability and offline support
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('/sw.js', { scope: '/' })
            .then(function(reg) {
              console.log('[PWA] Service Worker registered successfully with scope:', reg.scope);
            })
            .catch(function(err) {
              console.warn('[PWA] Service Worker registration failed:', err);
            });
        });
      }
    </script>
  </body>
